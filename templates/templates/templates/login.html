<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت تانل ایران</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
        }

        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-online {
            background: #10b981;
            color: white;
        }

        .status-offline {
            background: #ef4444;
            color: white;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #1f2937;
        }

        .main-content {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tunnel-list {
            margin-top: 20px;
        }

        .tunnel-item {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-right: 4px solid #667eea;
        }

        .tunnel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tunnel-name {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
        }

        .tunnel-actions {
            display: flex;
            gap: 10px;
        }

        .tunnel-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 14px;
            color: #1f2937;
            font-weight: 500;
        }

        .tunnel-stats {
            display: flex;
            gap: 20px;
            padding: 15px;
            background: white;
            border-radius: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-right: 4px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-right: 4px solid #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f4f6;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .config-section {
            margin-bottom: 30px;
        }

        .config-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e7eb;
        }

        .inbound-list {
            display: grid;
            gap: 10px;
        }

        .inbound-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9fafb;
            border-radius: 5px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚀 پنل مدیریت تانل ایران</h1>
            <div class="header-info">
                <span id="serverStatus" class="status-badge status-offline">در حال بررسی...</span>
                <span id="currentTime"></span>
                <button onclick="logout()" class="logout-btn">خروج</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>تانل‌های فعال</h3>
                <div class="value" id="activeTunnels">0</div>
            </div>
            <div class="stat-card">
                <h3>مصرف CPU</h3>
                <div class="value" id="cpuUsage">0%</div>
            </div>
            <div class="stat-card">
                <h3>مصرف RAM</h3>
                <div class="value" id="memoryUsage">0%</div>
            </div>
            <div class="stat-card">
                <h3>اتصالات</h3>
                <div class="value" id="totalConnections">0</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('tunnels')">تانل‌ها</button>
                <button class="tab" onclick="switchTab('inbounds')">اینباندهای X-UI</button>
                <button class="tab" onclick="switchTab('settings')">تنظیمات</button>
            </div>

            <!-- Tunnels Tab -->
            <div id="tunnels" class="tab-content active">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <button class="btn btn-primary" onclick="showCreateTunnelModal()">➕ ایجاد تانل جدید</button>
                    <button class="btn btn-success" onclick="syncWithXUI()">🔄 همگام‌سازی با X-UI</button>
                </div>
                <div id="tunnelList" class="tunnel-list">
                    <!-- Tunnels will be loaded here -->
                </div>
            </div>

            <!-- Inbounds Tab -->
            <div id="inbounds" class="tab-content">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <h3>اینباندهای سرور خارج</h3>
                    <button class="btn btn-primary" onclick="loadInbounds()">🔄 بروزرسانی لیست</button>
                </div>
                <div id="inboundList" class="inbound-list">
                    <!-- Inbounds will be loaded here -->
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="settings" class="tab-content">
                <div class="config-section">
                    <h3>تنظیمات سرور</h3>
                    <div class="form-group">
                        <label class="form-label">آدرس IP سرور خارج</label>
                        <input type="text" id="foreignIp" class="form-input" value="{{ config.get('foreign_ip', '') }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">پورت سرور خارج</label>
                        <input type="number" id="foreignPort" class="form-input" value="{{ config.get('foreign_port', 8080) }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">نوع پروتکل</label>
                        <select id="protocol" class="form-input">
                            <option value="tcp" {% if config.get('protocol') == 'tcp' %}selected{% endif %}>TCP</option>
                            <option value="ws" {% if config.get('protocol') == 'ws' %}selected{% endif %}>WebSocket (WS)</option>
                            <option value="wss" {% if config.get('protocol') == 'wss' %}selected{% endif %}>WebSocket Secure (WSS)</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="saveSettings()">💾 ذخیره تنظیمات</button>
                </div>

                <div class="config-section">
                    <h3>تغییر رمز عبور</h3>
                    <div class="form-group">
                        <label class="form-label">رمز عبور فعلی</label>
                        <input type="password" id="oldPassword" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">رمز عبور جدید</label>
                        <input type="password" id="newPassword" class="form-input">
                    </div>
                    <button class="btn btn-warning" onclick="changePassword()">🔐 تغییر رمز عبور</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Tunnel Modal -->
    <div id="tunnelModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">ایجاد تانل جدید</h2>
                <button class="close-btn" onclick="closeTunnelModal()">&times;</button>
            </div>
            <div id="modalAlert"></div>
            <form id="tunnelForm">
                <input type="hidden" id="tunnelId">
                <div class="form-group">
                    <label class="form-label">نام تانل</label>
                    <input type="text" id="tunnelName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">پورت محلی</label>
                    <input type="number" id="localPort" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">آدرس ریموت (IP:Port)</label>
                    <input type="text" id="remoteAddr" class="form-input" placeholder="1.2.3.4:443" required>
                </div>
                <div class="form-group">
                    <label class="form-label">SNI (اختیاری)</label>
                    <input type="text" id="sni" class="form-input" placeholder="example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">شروع خودکار</label>
                    <select id="autoStart" class="form-input">
                        <option value="true">بله</option>
                        <option value="false">خیر</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">💾 ذخیره</button>
                    <button type="button" class="btn btn-secondary" onclick="closeTunnelModal()">لغو</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tunnels = [];
        let stats = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTunnels();
            loadStats();
            updateTime();
            setInterval(loadTunnels, 5000);
            setInterval(loadStats, 3000);
            setInterval(updateTime, 1000);
        });

        // Switch tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            if (tabName === 'inbounds') {
                loadInbounds();
            }
        }

        // Load tunnels
        async function loadTunnels() {
            try {
                const response = await fetch('/api/tunnels');
                const data = await response.json();

                if (data.success) {
                    tunnels = data.tunnels;
                    renderTunnels();
                }
            } catch (error) {
                console.error('Error loading tunnels:', error);
            }
        }

        // Render tunnels
        function renderTunnels() {
            const container = document.getElementById('tunnelList');

            if (tunnels.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>هیچ تانلی یافت نشد</h3>
                        <p>برای شروع، یک تانل جدید ایجاد کنید</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = tunnels.map(tunnel => `
                <div class="tunnel-item">
                    <div class="tunnel-header">
                        <div>
                            <div class="tunnel-name">${tunnel.name}</div>
                            <span class="status-badge ${tunnel.status === 'running' ? 'status-online' : 'status-offline'}">
                                ${tunnel.status === 'running' ? '● فعال' : '○ غیرفعال'}
                            </span>
                        </div>
                        <div class="tunnel-actions">
                            ${tunnel.status === 'running' ?
                                `<button class="btn btn-danger" onclick="stopTunnel('${tunnel.id}')">⏹ توقف</button>` :
                                `<button class="btn btn-success" onclick="startTunnel('${tunnel.id}')">▶ شروع</button>`
                            }
                            <button class="btn btn-warning" onclick="restartTunnel('${tunnel.id}')">🔄 ری‌استارت</button>
                            <button class="btn btn-secondary" onclick="editTunnel('${tunnel.id}')">✏️ ویرایش</button>
                            <button class="btn btn-danger" onclick="deleteTunnel('${tunnel.id}')">🗑️ حذف</button>
                        </div>
                    </div>
                    <div class="tunnel-info">
                        <div class="info-item">
                            <span class="info-label">پورت محلی</span>
                            <span class="info-value">${tunnel.local_port}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">آدرس ریموت</span>
                            <span class="info-value">${tunnel.remote_addr}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">پروتکل</span>
                            <span class="info-value">${tunnel.protocol.toUpperCase()}</span>
                        </div>
                        ${tunnel.stats ? `
                            <div class="info-item">
                                <span class="info-label">CPU</span>
                                <span class="info-value">${tunnel.stats.cpu_percent.toFixed(1)}%</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">RAM</span>
                                <span class="info-value">${tunnel.stats.memory_mb.toFixed(0)} MB</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">اتصالات</span>
                                <span class="info-value">${tunnel.stats.connections}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Start tunnel
        async function startTunnel(id) {
            try {
                const response = await fetch(`/api/tunnels/${id}/start`, { method: 'POST' });
                const data = await response.json();
                showAlert(data.success ? 'success' : 'error', data.message);
                loadTunnels();
            } catch (error) {
                showAlert('error', 'خطا در شروع تانل');
            }
        }

        // Stop tunnel
        async function stopTunnel(id) {
            try {
                const response = await fetch(`/api/tunnels/${id}/stop`, { method: 'POST' });
                const data = await response.json();
                showAlert(data.success ? 'success' : 'error', data.message);
                loadTunnels();
            } catch (error) {
                showAlert('error', 'خطا در توقف تانل');
            }
        }

        // Restart tunnel
        async function restartTunnel(id) {
            try {
                const response = await fetch(`/api/tunnels/${id}/restart`, { method: 'POST' });
                const data = await response.json();
                showAlert(data.success ? 'success' : 'error', data.message);
                loadTunnels();
            } catch (error) {
                showAlert('error', 'خطا در ری‌استارت تانل');
            }
        }

        // Delete tunnel
        async function deleteTunnel(id) {
            if (!confirm('آیا مطمئن هستید که می‌خواهید این تانل را حذف کنید؟')) return;

            try {
                const response = await fetch(`/api/tunnels/${id}`, { method: 'DELETE' });
                const data = await response.json();
                showAlert(data.success ? 'success' : 'error', data.success ? 'تانل حذف شد' : 'خطا در حذف');
                loadTunnels();
            } catch (error) {
                showAlert('error', 'خطا در حذف تانل');
            }
        }

        // Show create tunnel modal
        function showCreateTunnelModal() {
            document.getElementById('modalTitle').textContent = 'ایجاد تانل جدید';
            document.getElementById('tunnelForm').reset();
            document.getElementById('tunnelId').value = '';
            document.getElementById('tunnelModal').classList.add('active');
        }

        // Edit tunnel
        function editTunnel(id) {
            const tunnel = tunnels.find(t => t.id === id);
            if (!tunnel) return;

            document.getElementById('modalTitle').textContent = 'ویرایش تانل';
            document.getElementById('tunnelId').value = tunnel.id;
            document.getElementById('tunnelName').value = tunnel.name;
            document.getElementById('localPort').value = tunnel.local_port;
            document.getElementById('remoteAddr').value = tunnel.remote_addr;
            document.getElementById('sni').value = tunnel.sni || '';
            document.getElementById('autoStart').value = tunnel.auto_start ? 'true' : 'false';
            document.getElementById('tunnelModal').classList.add('active');
        }

        // Close tunnel modal
        function closeTunnelModal() {
            document.getElementById('tunnelModal').classList.remove('active');
        }

        // Submit tunnel form
        document.getElementById('tunnelForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const tunnelId = document.getElementById('tunnelId').value;
            const tunnelData = {
                name: document.getElementById('tunnelName').value,
                local_port: parseInt(document.getElementById('localPort').value),
                remote_addr: document.getElementById('remoteAddr').value,
                sni: document.getElementById('sni').value,
                auto_start: document.getElementById('autoStart').value === 'true'
            };

            try {
                const url = tunnelId ? `/api/tunnels/${tunnelId}` : '/api/tunnels';
                const method = tunnelId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tunnelData)
                });

                const data = await response.json();

                if (data.success) {
                    closeTunnelModal();
                    showAlert('success', tunnelId ? 'تانل بروزرسانی شد' : 'تانل ایجاد شد');
                    loadTunnels();
                } else {
                    showAlert('error', 'خطا در ذخیره تانل');
                }
            } catch (error) {
                showAlert('error', 'خطا در ارتباط با سرور');
            }
        });

        // Load inbounds
        async function loadInbounds() {
            const container = document.getElementById('inboundList');
            container.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="loading"></div></div>';

            try {
                const response = await fetch('/api/inbounds');
                const data = await response.json();

                if (data.success) {
                    const inbounds = data.inbounds || [];

                    if (inbounds.length === 0) {
                        container.innerHTML = '<div class="empty-state"><p>هیچ اینباندی یافت نشد</p></div>';
                        return;
                    }

                    container.innerHTML = inbounds.map(inbound => `
                        <div class="inbound-item">
                            <div>
                                <strong>${inbound.remark}</strong><br>
                                <small>پورت: ${inbound.port} | پروتکل: ${inbound.protocol}</small>
                            </div>
                            <button class="btn btn-primary" onclick="createTunnelFromInbound(${inbound.port}, '${inbound.remark}')">
                                ➕ ایجاد تانل
                            </button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="alert alert-error">خطا در دریافت اینباندها (${data.error})</div>`;
                }
            } catch (error) {
                container.innerHTML = '<div class="alert alert-error">خطا در ارتباط با Agent</div>';
            }
        }

        // Create tunnel from inbound
        function createTunnelFromInbound(port, remark) {
            const foreignIp = document.getElementById('foreignIp').value;

            document.getElementById('tunnelName').value = remark;
            document.getElementById('localPort').value = port;
            document.getElementById('remoteAddr').value = `${foreignIp}:${port}`;
            showCreateTunnelModal();
        }

        // Sync with X-UI
        async function syncWithXUI() {
            try {
                const response = await fetch('/api/inbounds/sync', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    showAlert('success', `${data.created} تانل جدید ایجاد شد از ${data.total} اینباند`);
                    loadTunnels();
                } else {
                    showAlert('error', data.error || 'خطا در همگام‌سازی');
                }
            } catch (error) {
                showAlert('error', 'خطا در ارتباط با سرور');
            }
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                if (data.success) {
                    stats = data.stats;
                    updateStats();
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Update stats display
        function updateStats() {
            document.getElementById('activeTunnels').textContent = tunnels.filter(t => t.status === 'running').length;
            document.getElementById('cpuUsage').textContent = stats.cpu_percent ? stats.cpu_percent.toFixed(1) + '%' : '0%';
            document.getElementById('memoryUsage').textContent = stats.memory ? stats.memory.percent.toFixed(1) + '%' : '0%';

            let totalConnections = 0;
            Object.values(stats.tunnels || {}).forEach(t => {
                totalConnections += t.connections || 0;
            });
            document.getElementById('totalConnections').textContent = totalConnections;

            // Update server status
            const statusBadge = document.getElementById('serverStatus');
            const hasRunning = tunnels.some(t => t.status === 'running');
            statusBadge.className = hasRunning ? 'status-badge status-online' : 'status-badge status-offline';
            statusBadge.textContent = hasRunning ? 'آنلاین' : 'آفلاین';
        }

        // Update time
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('fa-IR');
        }

        // Save settings
        async function saveSettings() {
            const settings = {
                foreign_ip: document.getElementById('foreignIp').value,
                foreign_port: parseInt(document.getElementById('foreignPort').value),
                protocol: document.getElementById('protocol').value
            };

            try {
                const response = await fetch('/api/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });

                const data = await response.json();
                showAlert(data.success ? 'success' : 'error', data.success ? 'تنظیمات ذخیره شد' : 'خطا در ذخیره');
            } catch (error) {
                showAlert('error', 'خطا در ارتباط با سرور');
            }
        }

        // Change password
        async function changePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;

            if (!oldPassword || !newPassword) {
                showAlert('error', 'لطفاً تمام فیلدها را پر کنید');
                return;
            }

            try {
                const response = await fetch('/api/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password: oldPassword, new_password: newPassword })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('success', 'رمز عبور تغییر کرد');
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                } else {
                    showAlert('error', data.error || 'خطا در تغییر رمز عبور');
                }
            } catch (error) {
                showAlert('error', 'خطا در ارتباط با سرور');
            }
        }

        // Logout
        function logout() {
            window.location.href = '/logout';
        }

        // Show alert
        function showAlert(type, message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.style.opacity = '0';
                setTimeout(() => alertDiv.remove(), 300);
            }, 3000);

            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '9999';
            alertDiv.style.transition = 'opacity 0.3s';
        }
    </script>
</body>
</html>
